[[permission]]
identifier = "purr-core"
description = "Purr core commands available only to the trusted local main webview."
commands.allow = [
  "exit_app",
  "secret_transfer",
  "observability_integrations",
  "observability_validate_config",
  "observability_trace",
  "cancel_observability",
  "save_response_body",
  "response_content_save",
  "response_content_inspect",
  "response_content_read_range",
  "response_content_read_lines",
  "response_content_search",
  "response_content_format",
  "response_content_query",
  "cancel_response_content_operation",
  "response_content_release",
  "attachment_begin",
  "attachment_append",
  "attachment_finish",
  "attachment_abort",
  "request_file_create",
  "request_file_append",
  "request_file_finish",
  "request_file_release",
  "request_file_from_attachment",
  "start_http",
  "cancel_http",
  "import_collection",
  "authorize_oauth",
  "cancel_oauth",
  "load_persistence",
  "load_project",
  "read_local_attachment",
  "list_request_history",
